[sources]
# Without this the test environment resolves the registered PowerSystemsUpdater instead of
# the working tree, so local changes are never exercised.
PowerSystemsUpdater = {path = ".."}
# Test-only dep: PSU must never gain a package dependency on PSY, but the test suite and
# fixture generation exercise translated output against real PSY types.
PowerSystems = {url = "https://github.com/Sienna-Platform/PowerSystems.jl.git", rev = "jd/openapi-1x"}
# Branch pins until the OpenAPI packages are registered and the psy6-line branches merge.
# PowerOpenAPIModels' own transitive deps (PowerCore-/PowerDynamics-/PowerInvestments-/
# PowerOperationsOpenAPIModels and both Infrastructure*OpenAPIModels packages) are not
# imported directly here — they are deps of the PowerOpenAPIModels umbrella, and [sources]
# are not inherited transitively, so this env must pin them itself or a fresh resolve fails
# on "has no known versions".
InfrastructureSystems = {url = "https://github.com/Sienna-Platform/InfrastructureSystems.jl.git", rev = "jd/openapi-1x-suite"}
InfrastructureCoreOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "jd/openapi_deps_update", subdir = "InfrastructureCoreOpenAPIModels.jl"}
InfrastructureTimeSeriesOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "jd/openapi_deps_update", subdir = "InfrastructureTimeSeriesOpenAPIModels.jl"}
PowerCoreOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "jd/openapi_deps_update", subdir = "PowerCoreOpenAPIModels.jl"}
PowerDynamicsOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "jd/openapi_deps_update", subdir = "PowerDynamicsOpenAPIModels.jl"}
PowerInvestmentsOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "jd/openapi_deps_update", subdir = "PowerInvestmentsOpenAPIModels.jl"}
PowerOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "jd/openapi_deps_update", subdir = "PowerOpenAPIModels.jl"}
PowerOperationsOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "jd/openapi_deps_update", subdir = "PowerOperationsOpenAPIModels.jl"}

[compat]
julia = "^1.6"
