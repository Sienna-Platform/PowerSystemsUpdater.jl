[deps]
Aqua = "4c88cf16-eb10-579e-8560-4a9242c79595"
InfrastructureSystems = "2cd47ed4-ca9b-11e9-27f2-ab636a7671f1"
Logging = "56ddb016-857b-54e1-b83d-db4d58db5568"
PowerCoreOpenAPIModels = "b7b40286-e793-417d-a9a0-b1583e4da1cb"
PowerOperationsOpenAPIModels = "a372b6d7-45a2-44c2-8199-6a724b72e8ff"
PowerSystems = "bcd98974-b02a-5e2f-9ee0-a103f5c450dd"
PowerSystemsUpdater = "11b707e9-e006-4f7c-8f76-be36cb0f20e4"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[sources]
# Without this the test environment resolves the registered PowerSystemsUpdater instead of
# the working tree, so local changes are never exercised.
PowerSystemsUpdater = {path = ".."}
# Test-only dep: PSU must never gain a package dependency on PSY, but the test suite and
# fixture generation exercise translated output against real PSY types.
PowerSystems = {url = "https://github.com/Sienna-Platform/PowerSystems.jl.git", rev = "psy6"}
# Pin until the psy6-line InfrastructureSystems is registered. Held at the last IS4 commit before
# its InfraStore 0.15 bump (0ea15bae2): PowerSystems psy6 and PowerSystemsUpdater both still
# require InfraStore 0.14, so IS4 head cannot resolve with them. Return to `rev = "IS4"` once
# both move to 0.15.
InfrastructureSystems = {url = "https://github.com/Sienna-Platform/InfrastructureSystems.jl.git", rev = "eafc6f3550a40f2687fec2808c7b47016b2cef52"}

[compat]
julia = "^1.6"
