[sources]
# Without this the test environment resolves the registered PowerSystemsUpdater instead of
# the working tree, so local changes are never exercised.
PowerSystemsUpdater = {path = ".."}
# Test-only dep: PSU must never gain a package dependency on PSY, but the test suite and
# fixture generation exercise translated output against real PSY types.
PowerSystems = {path = "../../PowerSystems.jl"}
# LOCAL PATH CO-DEV PINS (temporary): the OpenAPI packages are consumed straight from the
# local PowerOpenAPIModels checkout (regenerated from SiennaSchemas main against the native
# OpenAPI.jl 1.1 generator), not from a pushed git rev. Revert to git-url pins once that
# checkout is pushed/merged. PowerOpenAPIModels' own transitive deps (PowerCore-/
# PowerDynamics-/PowerInvestments-/PowerOperationsOpenAPIModels and both
# Infrastructure*OpenAPIModels packages) are not imported directly here — they are deps of
# the PowerOpenAPIModels umbrella, and [sources] are not inherited transitively, so this env
# must pin them itself or a fresh resolve fails on "has no known versions". InfrastructureSystems
# points at the IS4 branch (the same rev PowerSystems psy6 pins), not the local checkout,
# since the local IS checkout sits on jd/arrays_only_sidecar, ahead of IS4.
InfrastructureSystems = {path = "../../InfrastructureSystems.jl"}
InfrastructureCoreOpenAPIModels = {path = "../../PowerOpenAPIModels/InfrastructureCoreOpenAPIModels.jl"}
InfrastructureTimeSeriesOpenAPIModels = {path = "../../PowerOpenAPIModels/InfrastructureTimeSeriesOpenAPIModels.jl"}
PowerCoreOpenAPIModels = {path = "../../PowerOpenAPIModels/PowerCoreOpenAPIModels.jl"}
PowerDynamicsOpenAPIModels = {path = "../../PowerOpenAPIModels/PowerDynamicsOpenAPIModels.jl"}
PowerInvestmentsOpenAPIModels = {path = "../../PowerOpenAPIModels/PowerInvestmentsOpenAPIModels.jl"}
PowerOpenAPIModels = {path = "../../PowerOpenAPIModels/PowerOpenAPIModels.jl"}
PowerOperationsOpenAPIModels = {path = "../../PowerOpenAPIModels/PowerOperationsOpenAPIModels.jl"}

[compat]
julia = "^1.6"
